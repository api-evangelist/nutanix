openapi: 3.2.0
info:
  title: Nutanix Prism Element API v2 Protection Domains API
  description: API for managing individual Nutanix clusters through Prism Element, including storage containers, hosts, virtual machines, and cluster operations. The v2 API is cluster-local and available through Prism Element only. It exposes operations specific to local cluster entities such as storage containers, data-at-rest encryption, storage pools, and hosts. Authentication uses HTTP Basic Auth with cluster credentials.
  version: '2.0'
  contact:
    name: Nutanix Developer Support
    email: developer@nutanix.com
    url: https://www.nutanix.dev/
  termsOfService: https://www.nutanix.com/legal/terms-of-use
servers:
- url: https://{clusterIp}:9440/PrismGateway/services/rest/v2.0
  description: Prism Element Server
  variables:
    clusterIp:
      default: localhost
      description: IP address or FQDN of the Nutanix cluster or CVM.
security:
- basicAuth: []
tags:
- name: Protection Domains
  description: Manage protection domains that define groups of VMs and volume groups for data protection and disaster recovery.
paths:
  /protection_domains:
    get:
      operationId: listProtectionDomains
      summary: Nutanix List protection domains
      description: Retrieves a list of all protection domains configured on the cluster for data protection.
      tags:
      - Protection Domains
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
    post:
      operationId: createProtectionDomain
      summary: Nutanix Create a protection domain
      description: Creates a new protection domain for grouping entities for data protection and replication.
      tags:
      - Protection Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - value
              properties:
                value:
                  type: string
                  description: The name of the protection domain.
      responses:
        '201':
          description: Created
        '400':
          description: Bad request
        '401':
          description: Unauthorized
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using Prism Element username and password credentials.
externalDocs:
  description: Nutanix Prism Element v2 API Documentation
  url: https://www.nutanix.dev/api_references/prism-element/
