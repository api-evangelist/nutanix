aid: nutanix
name: Nutanix
description: >-
  Nutanix is a hyper-converged infrastructure solution that integrates compute, virtualization, storage, networking, and
  security to power enterprise applications. Nutanix provides public APIs for managing and automating infrastructure
  including Prism Central, Prism Element, Karbon Kubernetes, Nutanix Database Service (NDB), Cloud Clusters (NC2), NCM
  Self-Service, and the GA v4 API platform.
type: Index
accessModel:
  pricing: free-trial
  onboarding: self-serve
  trial: true
  try_now: true
  public: false
  label: Free trial · Self-serve signup
  confidence: high
